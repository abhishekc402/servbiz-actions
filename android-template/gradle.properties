org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# Required by the fast-patch path. Do not turn this back on.
#
# AGP's resource optimiser rewrites res/ file paths to short opaque names
# (res/mipmap-xxhdpi-v4/ic_launcher.png becomes res/-B.png), which makes it
# impossible to swap a launcher icon by path in a release APK. With this off the
# paths stay readable and tools/patch-app.mjs can replace icons in ~3 seconds
# instead of requiring a 90-second Gradle build.
#
# Measured cost: 1,695,250 -> 1,792,105 bytes, about 95 KB or 5.7%.
# ---------------------------------------------------------------------------
android.enableResourceOptimizations=false

# ---------------------------------------------------------------------------
# ARM64 build hosts (Oracle Ampere A1, Graviton, Asahi, Raspberry Pi)
#
# Google ships aapt2 as an x86_64-only binary. On aarch64 the build fails with
# an exec-format error that looks like a corrupt SDK. Drop an ARM64 aapt2 into
# the SDK and point AGP at it here, otherwise AGP silently downloads its own
# x86_64 copy from Maven and ignores the replacement.
#
# Uncomment on ARM hosts (provision/setup-build-host.sh writes this for you):
# android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/35.0.0/aapt2
# ---------------------------------------------------------------------------
